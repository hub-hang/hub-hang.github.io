<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的小网站</title>
    <style>
        /* CSS：专门管样子！颜色、布局、按钮样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #f4f7fa;
            color: #222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            margin-bottom: 12px;
            color: #1f2937;
        }
        p {
            color: #666;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 12px 26px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            margin: 6px;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        #tip {
            margin-top: 20px;
            color: #2563eb;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>👋 欢迎来到我的小站</h1>
        <p>这是我用代码搭建在 GitHub Pages 的第一个网页。<br>试试点击下面的按钮！</p>

        <!-- 按钮：看得见的元素 -->
        <button class="btn" id="helloBtn">点我弹出消息</button>
        <a class="btn" href="https://github.com" target="_blank">去GitHub逛逛</a>

        <div id="tip"></div>
    </div>

    <script>
        // JS：专门管交互！点击之后要做什么
        const btn = document.getElementById('helloBtn');
        const tipBox = document.getElementById('tip');

        btn.onclick = function() {
            tipBox.innerText = '✅ 你点击成功啦！代码收到你的操作了';
        }
    </script>
</body>
</html>
